<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deebot Buddy — T90 PRO OMNI Maintenance Tracker</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%231b1e23' stroke='%23334155' stroke-width='2'/%3E%3Cpath d='M32,33 L32,20 M32,33 L21,41 M32,33 L43,41' stroke='%23cbd5e1' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='50' r='3' fill='%2334d399'/%3E%3Ccircle cx='40' cy='50' r='3' fill='%2334d399'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('deebot-theme');
          if (
            saved === 'dark' ||
            (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
